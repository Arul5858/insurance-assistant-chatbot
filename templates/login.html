{% extends 'base.html' %}{% block title %}Login | Insurance Assistant{% endblock %}
{% block content %}<div class="auth-wrap"><div class="auth-card shadow-sm">
<div class="brand-mark">IA</div><h1 class="h3 text-center mb-1">Welcome back</h1><p class="text-muted text-center mb-4">Log in to continue to your Insurance Assistant.</p>
<form method="post"><label class="form-label">Email address</label><input class="form-control mb-3" type="email" name="email" autocomplete="email" required placeholder="you@example.com">
<label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" autocomplete="current-password" required placeholder="Your password">
<div class="form-check mb-4"><input class="form-check-input" type="checkbox" name="remember" id="remember"><label class="form-check-label" for="remember">Remember me</label></div>
<button class="btn btn-primary w-100 py-2">Log in</button></form>
<p class="text-center small mt-4 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div></div>{% endblock %}
